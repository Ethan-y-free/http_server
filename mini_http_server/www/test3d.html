<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>3D 测试</title>
<style>
*{margin:0;padding:0;} html,body{width:100%;height:100%}
#container{width:100%;height:100%}
</style>
<script>
window._AMapSecurityConfig = { securityJsCode: "be893ec371eceacf34bfcbba3ff1e922" };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=8eb24da9084fb43e35fffae70fd6d4d9&plugin=AMap.ControlBar,AMap.ToolBar"></script>
</head>
<body>
<div id="container"></div>
<script>
var map = new AMap.Map('container', {
    center: [115.816623, 28.727408],
    zoom: 16,
    viewMode: '3D',
    pitch: 50,
    rotation: -15,
    rotateEnable: true,
    pitchEnable: true,
    mapStyle: 'amap://styles/dark',
    zooms: [2, 20],
});

var controlBar = new AMap.ControlBar({
    position: { right: '10px', top: '10px' }
});
controlBar.addTo(map);

var toolBar = new AMap.ToolBar({
    position: { right: '40px', top: '110px' }
});
toolBar.addTo(map);

console.log('ControlBar added:', controlBar);
console.log('ToolBar added:', toolBar);
</script>
</body>
</html>
