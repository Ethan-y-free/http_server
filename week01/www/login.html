<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 江财麦庐园导航</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>
    <div class="login-bg"></div>

    <div class="login-card" id="login-card">
        <div class="lc-icon">🗺️</div>
        <h2>江财·麦庐园导航</h2>
        <p class="lc-sub">江西财经大学麦庐园校区智慧导览系统</p>

        <form id="login-form" autocomplete="off">
            <div class="input-wrap">
                <span class="iw-icon">👤</span>
                <input id="username" type="text" placeholder="请输入用户名" autocomplete="off" required>
            </div>
            <div class="input-wrap">
                <span class="iw-icon">🔒</span>
                <input id="password" type="password" placeholder="请输入密码" autocomplete="off" required>
            </div>
            <div class="lc-error" id="login-error"></div>
            <button type="submit" class="lc-btn" id="login-btn">
                <span>登 录</span>
            </button>
        </form>

        <p class="lc-hint">演示账号：admin / 123456</p>
    </div>

    <script>
    (function(){
        var form   = document.getElementById('login-form');
        var errEl  = document.getElementById('login-error');
        var btn    = document.getElementById('login-btn');
        var card   = document.getElementById('login-card');

        form.addEventListener('submit', function(e){
            e.preventDefault();
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value.trim();

            if (!u || !p) {
                errEl.textContent = '请输入用户名和密码';
                errEl.style.display = 'block';
                return;
            }

            btn.classList.add('loading');
            btn.innerHTML = '<span>验证中…</span>';
            errEl.style.display = 'none';

            // 模拟网络延迟
            setTimeout(function(){
                if (u === 'admin' && p === '123456') {
                    sessionStorage.setItem('auth', '1');
                    sessionStorage.setItem('user', u);
                    card.classList.add('success');
                    setTimeout(function(){
                        window.location.href = '/welcome.html';
                    }, 400);
                } else {
                    btn.classList.remove('loading');
                    btn.innerHTML = '<span>登 录</span>';
                    errEl.textContent = '用户名或密码错误';
                    errEl.style.display = 'block';
                    card.classList.add('shake');
                    setTimeout(function(){ card.classList.remove('shake'); }, 500);
                }
            }, 800);
        });

        // 已登录直接跳转
        if (sessionStorage.getItem('auth') === '1') {
            window.location.href = '/welcome.html';
        }
    })();
    </script>
</body>
</html>
